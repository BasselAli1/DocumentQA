services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OLLAMA_CHAT_MODEL: llama3.2:1b
      OLLAMA_EMBEDDING_MODEL: snowflake-arctic-embed:22m
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      RAG_COLLECTION_NAME: rag_tutorial
      RAG_PERSIST_DIR: /data/chroma
    volumes:
      - rag-data:/data
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  rag-data:
  postgres-data:
