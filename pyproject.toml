[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-openai-rag"
version = "0.1.0"
description = "A complete LangChain RAG project backed by OpenAI chat and embedding models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Basel Ali" }
]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi[standard]>=0.115.0",
  "langchain>=1.0.0",
  "langchain-chroma>=0.1.4",
  "langchain-core>=1.5.0",
  "langchain-text-splitters>=0.3.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.3",
  "uvicorn>=0.30.0",
  "psycopg2-binary>=2.9.12",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "langchain-openai>=1.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]
[project.scripts]
rag = "langchain_openai_rag.cli:main"
rag-api = "langchain_openai_rag.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on function calls in argument defaults for dependency injection.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.fastapi]
entrypoint = "langchain_openai_rag.api:app"